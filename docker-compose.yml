services:
  voxeldash-one:
    image: ghcr.io/gnmyt/voxeldash-one:1.2.0
    restart: on-failure
    init: true
    network_mode: host

    volumes:
      - ${APP_DATA_DIR}/data:/data

    environment:
      PORT: "7867"
      VOXELDASH_HOME: /data
      MASTER_HOST: "127.0.0.1"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
